[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-pd-validation"
version = "0.1.0"
description = "PD scorecard, challenger model, LGD and a second-line validation report on Lending Club data"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Rodrigo Grandez"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
